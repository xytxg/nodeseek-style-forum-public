<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" preserveAspectRatio="none">
  <filter id="noise" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="4" seed="27" stitchTiles="stitch" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#noise)" opacity="0.9" />
</svg>
